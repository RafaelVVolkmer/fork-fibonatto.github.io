worker_processes auto;
worker_rlimit_nofile 16384;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
	worker_connections 4096;
	multi_accept on;
}

http {
	include /etc/nginx/mime.types;

	log_format upstream_combined
		'$remote_addr - $remote_user [$time_local] "$request" '
		'$status $body_bytes_sent "$http_referer" "$http_user_agent" '
		'request_time=$request_time upstream=$upstream_addr '
		'upstream_status=$upstream_status upstream_time=$upstream_response_time';

	access_log /dev/stdout upstream_combined;
	default_type application/octet-stream;
	server_tokens off;

	client_body_temp_path /tmp/client-body;
	proxy_temp_path /tmp/proxy;
	fastcgi_temp_path /tmp/fastcgi;
	uwsgi_temp_path /tmp/uwsgi;
	scgi_temp_path /tmp/scgi;
	proxy_cache_path /tmp/nginx-cache
		levels=1:2
		keys_zone=ehs_cache:16m
		max_size=64m
		inactive=30m
		use_temp_path=off;

	limit_req_zone $binary_remote_addr zone=request_rate:10m rate=10r/s;
	limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
	limit_req_status 429;
	limit_conn_status 429;

	sendfile on;
	tcp_nopush on;
	keepalive_timeout 30s;
	keepalive_requests 100;
	client_header_timeout 10s;
	client_body_timeout 10s;
	send_timeout 15s;
	reset_timedout_connection on;
	client_max_body_size 64k;
	large_client_header_buffers 2 8k;
	ignore_invalid_headers on;
	underscores_in_headers off;

	upstream ehs_backends {
		zone ehs_backends 64k;
		least_conn;
		keepalive 32;

		server app-a:8080 max_fails=3 fail_timeout=10s;
		server app-b:8080 max_fails=3 fail_timeout=10s;
	}

	# Plain HTTP exists only for health probes and an HTTPS redirect.
	server {
		listen 8080 default_server;
		server_name _;

		location = /healthz {
			access_log off;
			default_type text/plain;
			return 200 "ok\n";
		}

		location / {
			limit_req zone=request_rate burst=20 nodelay;
			limit_conn connections_per_ip 10;
			return 308 https://$host:8443$request_uri;
		}
	}

	server {
		listen 8443 ssl default_server;
		http2 on;
		server_name _;

		ssl_certificate /etc/nginx/tls/tls.crt;
		ssl_certificate_key /etc/nginx/tls/tls.key;
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
		ssl_prefer_server_ciphers off;
		ssl_ecdh_curve X25519:secp256r1;
		ssl_session_cache shared:TLS:10m;
		ssl_session_timeout 1d;
		ssl_session_tickets off;

		add_header Strict-Transport-Security "max-age=31536000" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
		add_header Cross-Origin-Opener-Policy "same-origin" always;
		add_header Cross-Origin-Resource-Policy "same-origin" always;
		add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;

		location = /healthz {
			access_log off;
			default_type text/plain;
			return 200 "ok\n";
		}

		location / {
			limit_except GET {
				deny all;
			}

			limit_req zone=request_rate burst=30 nodelay;
			limit_conn connections_per_ip 20;

			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Host $host;
			proxy_set_header X-Forwarded-Proto https;
			proxy_hide_header Server;

			proxy_connect_timeout 2s;
			proxy_send_timeout 10s;
			proxy_read_timeout 10s;
			proxy_next_upstream error timeout http_502 http_503 http_504;
			proxy_next_upstream_tries 2;

			proxy_buffering on;
			proxy_cache ehs_cache;
			proxy_cache_methods GET HEAD;
			proxy_cache_lock on;
			proxy_cache_background_update on;
			proxy_cache_use_stale
				error
				timeout
				updating
				http_500
				http_502
				http_503
				http_504;
			proxy_cache_valid 200 10m;

			proxy_pass http://ehs_backends;
		}
	}
}

# EOF
