---
name: Build and scan attested OCI images

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dockerfile:
    name: Validate Docker definitions
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Install Docker definition linters
        env:
          LINT_BIN_DIR: ${{ runner.temp }}/ehs-docker-lint-bin
        run: |
          ./scripts/install-tools.sh conftest hadolint
          echo "${LINT_BIN_DIR}" >> "${GITHUB_PATH}"

      - name: Run the pre-build Docker gate
        run: ./scripts/tests/docker_test.sh lint

  build:
    needs: dockerfile
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - runtime
          - edge

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Derive deterministic OCI metadata
        id: metadata
        run: |
          {
            echo "build_date=$(git show -s --format=%cI "${GITHUB_SHA}")"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.target }}"
            echo "local_tag=ehs-${{ matrix.target }}:${GITHUB_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build local image for security gate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          pull: true
          load: true
          push: false
          tags: ${{ steps.metadata.outputs.local_tag }}
          build-args: |
            VERSION=${{ github.sha }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Install image audit tools
        env:
          LINT_BIN_DIR: ${{ runner.temp }}/ehs-image-audit-bin
        run: |
          ./scripts/install-tools.sh \
            container-structure-test \
            dive \
            dockle \
            grype \
            trivy
          echo "${LINT_BIN_DIR}" >> "${GITHUB_PATH}"

      - name: Run the post-build image gate
        run: >-
          ./scripts/tests/docker_test.sh image
          "${{ matrix.target }}"
          "${{ steps.metadata.outputs.local_tag }}"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish attested image after security gate
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          pull: true
          push: true
          tags: >-
            ${{ steps.metadata.outputs.image }}:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          sbom: true
          provenance: mode=max

# EOF
